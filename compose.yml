services:
  watchtower:
    image: nickfedor/watchtower
    environment:
      -  WATCHTOWER_POLL_INTERVAL=60 <em># Poll every 60 seconds</em>
    volumes:
      - /run/user/1000/docker.sock:/var/run/docker.sock
    container_name: watchtower

  webapp:
    image: gyro5/docker-hy-webapp:main
    ports:
      - 8080:8080
